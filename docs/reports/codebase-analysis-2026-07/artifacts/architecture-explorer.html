<style>/* Shared design system for the codebase-analysis artifacts.
   Palette: dataviz reference instance (brand-neutral, CVD-validated).
   Identity: mono-forward engineering-audit — ui-monospace for labels/data,
   system sans for prose. Token-level theming; the viewer's toggle stamps
   data-theme on :root and must win over the media query in both directions. */

:root {
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-soft: #cde2fb;
  --s1: #2a78d6; --s2: #1baf7a; --s3: #eda100; --s4: #008300;
  --s5: #4a3aa7; --s6: #e34948; --s7: #e87ba4; --s8: #eb6834;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --shadow: 0 1px 3px rgba(11, 11, 11, 0.07), 0 4px 14px rgba(11, 11, 11, 0.05);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: #104281;
    --s1: #3987e5; --s2: #199e70; --s3: #c98500; --s4: #008300;
    --s5: #9085e9; --s6: #e66767; --s7: #d55181; --s8: #d95926;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 4px 14px rgba(0, 0, 0, 0.4);
  }
}
:root[data-theme="light"] {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
  --muted: #898781; --grid: #e1e0d9; --baseline: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10); --accent: #2a78d6; --accent-soft: #cde2fb;
  --s1: #2a78d6; --s2: #1baf7a; --s3: #eda100; --s4: #008300;
  --s5: #4a3aa7; --s6: #e34948; --s7: #e87ba4; --s8: #eb6834;
  --shadow: 0 1px 3px rgba(11, 11, 11, 0.07), 0 4px 14px rgba(11, 11, 11, 0.05);
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --baseline: #383835;
  --border: rgba(255, 255, 255, 0.10); --accent: #3987e5; --accent-soft: #104281;
  --s1: #3987e5; --s2: #199e70; --s3: #c98500; --s4: #008300;
  --s5: #9085e9; --s6: #e66767; --s7: #d55181; --s8: #d95926;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 4px 14px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ---- chrome ---- */
.topbar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 22px;
  border-bottom: 1px solid var(--grid);
  background: var(--surface);
  position: sticky; top: 0; z-index: 40;
}
.topbar .brand { display: flex; flex-direction: column; gap: 1px; min-width: 220px; }
.eyebrow {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted);
}
.title { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
.spacer { flex: 1; }

.wrap { max-width: 1480px; margin: 0 auto; padding: 18px 22px 60px; }

/* ---- controls ---- */
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn, .chipbtn {
  font-family: var(--mono); font-size: 11.5px;
  padding: 5px 11px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  cursor: pointer; user-select: none; transition: border-color .12s, background .12s;
}
.btn:hover, .chipbtn:hover { border-color: var(--accent); color: var(--ink); }
.btn:focus-visible, .chipbtn:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.btn[aria-pressed="true"], .chipbtn[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
input[type="search"], select {
  font-family: var(--mono); font-size: 12px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 10px;
}

/* ---- panels & tiles ---- */
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow);
}
.panel > .panel-head {
  padding: 10px 14px; border-bottom: 1px solid var(--grid);
  display: flex; align-items: baseline; gap: 10px;
}
.panel > .panel-head h2 { margin: 0; font-size: 13px; font-weight: 650; }
.panel > .panel-body { padding: 14px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.tile .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tile .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
.tile .d { font-size: 11px; color: var(--ink-2); }

/* ---- chips: severity & status (icon+label, never color alone) ---- */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em;
  padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.sev-high .dot { background: var(--critical); }
.sev-medium .dot { background: var(--serious); }
.sev-low .dot { background: var(--warning); }
.st-confirmed .dot { background: var(--good); }
.st-rejected .dot, .st-rejected-by-verifier .dot, .st-duplicate .dot { background: var(--muted); }
.st-seed-only .dot, .st-unverified .dot { background: var(--baseline); }

.layer-chip { font-family: var(--mono); font-size: 10px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border); }
.layer-docs { color: var(--s5); border-color: var(--s5); }
.layer-pipeline { color: var(--s1); border-color: var(--s1); }
.layer-src { color: var(--s2); border-color: var(--s2); }
.layer-ui { color: var(--s8); border-color: var(--s8); }

code, .mono { font-family: var(--mono); font-size: 0.92em; }
.quote {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
  background: var(--page); border: 1px solid var(--grid); border-left: 3px solid var(--accent);
  border-radius: 6px; padding: 7px 10px; margin: 6px 0; overflow-x: auto; white-space: pre-wrap;
}
.fileref { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }

/* ---- tooltip ---- */
.tip {
  position: fixed; z-index: 100; pointer-events: none;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
  padding: 8px 11px; font-size: 12px; max-width: 340px; display: none;
}
.tip .tip-title { font-weight: 650; margin-bottom: 2px; }
.tip .tip-sub { color: var(--ink-2); font-size: 11px; }

/* ---- tables ---- */
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--baseline);
}
table.data td { padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.data td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
table.data tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }

/* ---- misc ---- */
.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--ink-2); }
.legend .li { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.note { font-size: 11.5px; color: var(--muted); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.svgwrap { overflow: hidden; border-radius: 10px; }
svg text { font-family: var(--sans); }
svg .monolabel { font-family: var(--mono); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

letons are built with the 'test' placeholder model, so a forgotten override silently fabricates data","severity":"medium","status":"confirmed","category":"pattern"},"AT-09":{"title":"build_bundle fabricates claim_id from the entity name, and the CLI bypasses the factory entirely","severity":"low","status":"confirmed","category":"complexity"},"AT-10":{"title":"compare.py's off-scale handling documents unverified but silently lumps not-applicable in with it","severity":"low","status":"confirmed","category":"doc-drift"},"AT-11":{"title":"Auditor/Evaluator naming split is now baked into persisted artifacts; flipping the docs is cheaper than the planned code rename","severity":"medium","status":"confirmed","category":"taxonomy"},"AT-12":{"title":"independence has two uncoordinated writers: the ingestor LLM (with zero guidance) and a publisher-string classifier default","severity":"medium","status":"confirmed","category":"taxonomy"},"CMN-01":{"title":"models.py is two unrelated modules fused: the enum vocabulary and the provider gateway churn together at fan-in 48","severity":"high","status":"confirmed","category":"congestion"},"CMN-02":{"title":"Enum mirror to Zod is pure discipline; the repo already has the drift-guard pattern but never applied it to the 10 enum pairs","severity":"medium","status":"confirmed","category":"pattern"},"CMN-03":{"title":"Topic vocabulary is an enum in one place and free strings everywhere else","severity":"medium","status":"confirmed","category":"taxonomy"},"CMN-04":{"title":"Publisher-tier lists are hardcoded substring sets with known false-positive behavior, while the sibling blocklist is operator-editable YAML","severity":"medium","status":"confirmed","category":"pattern"},"CMN-05":{"title":"Corrupt audit sidecars read as empty audits, and the sidecar path rule is duplicated on the write side","severity":"medium","status":"confirmed","category":"complexity"},"CMN-06":{"title":"logging_setup.py fuses log plumbing with CLI presentation (gly
