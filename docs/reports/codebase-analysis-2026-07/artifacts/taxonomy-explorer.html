<title>Taxonomy & glossary — dangerousrobot.org codebase analysis</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>/* Shared design system for the codebase-analysis artifacts.
   Palette: dataviz reference instance (brand-neutral, CVD-validated).
   Identity: mono-forward engineering-audit — ui-monospace for labels/data,
   system sans for prose. Token-level theming; the viewer's toggle stamps
   data-theme on :root and must win over the media query in both directions. */

:root {
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-soft: #cde2fb;
  --s1: #2a78d6; --s2: #1baf7a; --s3: #eda100; --s4: #008300;
  --s5: #4a3aa7; --s6: #e34948; --s7: #e87ba4; --s8: #eb6834;
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --shadow: 0 1px 3px rgba(11, 11, 11, 0.07), 0 4px 14px rgba(11, 11, 11, 0.05);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: #104281;
    --s1: #3987e5; --s2: #199e70; --s3: #c98500; --s4: #008300;
    --s5: #9085e9; --s6: #e66767; --s7: #d55181; --s8: #d95926;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 4px 14px rgba(0, 0, 0, 0.4);
  }
}
:root[data-theme="light"] {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
  --muted: #898781; --grid: #e1e0d9; --baseline: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10); --accent: #2a78d6; --accent-soft: #cde2fb;
  --s1: #2a78d6; --s2: #1baf7a; --s3: #eda100; --s4: #008300;
  --s5: #4a3aa7; --s6: #e34948; --s7: #e87ba4; --s8: #eb6834;
  --shadow: 0 1px 3px rgba(11, 11, 11, 0.07), 0 4px 14px rgba(11, 11, 11, 0.05);
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --baseline: #383835;
  --border: rgba(255, 255, 255, 0.10); --accent: #3987e5; --accent-soft: #104281;
  --s1: #3987e5; --s2: #199e70; --s3: #c98500; --s4: #008300;
  --s5: #9085e9; --s6: #e66767; --s7: #d55181; --s8: #d95926;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 4px 14px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ---- chrome ---- */
.topbar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 22px;
  border-bottom: 1px solid var(--grid);
  background: var(--surface);
  position: sticky; top: 0; z-index: 40;
}
.topbar .brand { display: flex; flex-direction: column; gap: 1px; min-width: 220px; }
.eyebrow {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted);
}
.title { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
.spacer { flex: 1; }

.wrap { max-width: 1480px; margin: 0 auto; padding: 18px 22px 60px; }

/* ---- controls ---- */
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn, .chipbtn {
  font-family: var(--mono); font-size: 11.5px;
  padding: 5px 11px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  cursor: pointer; user-select: none; transition: border-color .12s, background .12s;
}
.btn:hover, .chipbtn:hover { border-color: var(--accent); color: var(--ink); }
.btn:focus-visible, .chipbtn:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.btn[aria-pressed="true"], .chipbtn[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
input[type="search"], select {
  font-family: var(--mono); font-size: 12px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 10px;
}

/* ---- panels & tiles ---- */
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow);
}
.panel > .panel-head {
  padding: 10px 14px; border-bottom: 1px solid var(--grid);
  display: flex; align-items: baseline; gap: 10px;
}
.panel > .panel-head h2 { margin: 0; font-size: 13px; font-weight: 650; }
.panel > .panel-body { padding: 14px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.tile .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tile .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
.tile .d { font-size: 11px; color: var(--ink-2); }

/* ---- chips: severity & status (icon+label, never color alone) ---- */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em;
  padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.sev-high .dot { background: var(--critical); }
.sev-medium .dot { background: var(--serious); }
.sev-low .dot { background: var(--warning); }
.st-confirmed .dot { background: var(--good); }
.st-rejected .dot, .st-rejected-by-verifier .dot, .st-duplicate .dot { background: var(--muted); }
.st-seed-only .dot, .st-unverified .dot { background: var(--baseline); }

.layer-chip { font-family: var(--mono); font-size: 10px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border); }
.layer-docs { color: var(--s5); border-color: var(--s5); }
.layer-pipeline { color: var(--s1); border-color: var(--s1); }
.layer-src { color: var(--s2); border-color: var(--s2); }
.layer-ui { color: var(--s8); border-color: var(--s8); }

code, .mono { font-family: var(--mono); font-size: 0.92em; }
.quote {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
  background: var(--page); border: 1px solid var(--grid); border-left: 3px solid var(--accent);
  border-radius: 6px; padding: 7px 10px; margin: 6px 0; overflow-x: auto; white-space: pre-wrap;
}
.fileref { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }

/* ---- tooltip ---- */
.tip {
  position: fixed; z-index: 100; pointer-events: none;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
  padding: 8px 11px; font-size: 12px; max-width: 340px; display: none;
}
.tip .tip-title { font-weight: 650; margin-bottom: 2px; }
.tip .tip-sub { color: var(--ink-2); font-size: 11px; }

/* ---- tables ---- */
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--baseline);
}
table.data td { padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.data td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
table.data tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }

/* ---- misc ---- */
.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--ink-2); }
.legend .li { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.note { font-size: 11.5px; color: var(--muted); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.svgwrap { overflow: hidden; border-radius: 10px; }
svg text { font-family: var(--sans); }
svg .monolabel { font-family: var(--mono); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<script>window.DATA = {"terminology":{"provenance":{"commit":"43a1575d73a38932173dab461d4d66c15ce9efdb","generated_by":"taxonomy analysts (docs, code, reader) merged; counts trace to word-frequency/*.json or recorded greps","note":"variant sample quotes were mechanically verified against the repo"},"concepts":[{"concept":"Claim topic classification (the 8-value subject-area vocabulary)","variants":[{"term":"Category (Python enum)","layer":"pipeline","count_source":"grep -c 'Category' pipeline/orchestrator/cli.py = 7; word-frequency/pipeline-identifiers.json word_parts topic=13, topics=34","sample":{"file":"pipeline/common/models.py","line":112,"quote":"class Category(str, Enum):"}},{"term":"topics (frontmatter / Zod field)","layer":"docs","count_source":"grep -c 'topics' pipeline/orchestrator/cli.py = 24; enum-drift.json in_sync pair 'Category -> topics:154'","sample":{"file":"src/content.config.ts","line":154,"quote":"topics: z.array(z.enum(["}},{"term":"Category / CATEGORY_LABELS (TS type)","layer":"src","count_source":"word-frequency/site-identifiers.json word_parts category=4, topic=8","sample":{"file":"src/lib/research.ts","line":11,"quote":"export const CATEGORY_LABELS: Record\u003cCategory, string> = {"}},{"term":"topic (reader URL /research/topics/ and CLI --topic)","layer":"ui","count_source":"grep -c 'reassess' pipeline/orchestrator/cli.py = 4 (step-audit shares the --topic option); site route src/pages/research/topics/","sample":{"file":"pipeline/orchestrator/cli.py","line":1303,"quote":"@click.option(\"--topic\", default=None, help=\"Audit all claims with a given topic\")"}},{"term":"category (CSS class rendering topic labels)","layer":"ui","count_source":"grep -c 'ai-literacy' src/content.config.ts = 3 (three hand-synced copies of the value list in one file)","sample":{"file":"src/components/ClaimRow.astro","line":36,"quote":"\u003cspan class=\"category\">{topicLabels}\u003c/span>"}}],"collision":"The field name `topics` is also used by the resources co VerdictAssessment(BaseModel):"}},{"term":"verdict (attribute on AnalystOutput whose type is the whole VerdictAssessment)","layer":"pipeline","count_source":"grep VerdictAssessment pipeline/analyst/agent.py, pipeline/orchestrator/persistence.py (verdict_write_kwargs takes 'verdict: VerdictAssessment')","sample":{"file":"pipeline/analyst/agent.py","line":220,"quote":"verdict: VerdictAssessment"}},{"term":"verdict (docs: 'the combined post-review artifact')","layer":"docs","count_source":"grep -c 'Evaluator' AGENTS.md = 4 (same paragraph defines this third meaning)","sample":{"file":"AGENTS.md","line":11,"quote":"The combined post-review artifact is the **verdict**."}}],"collision":"'verdict' means (a) the 7-value enum, (b) the analyst's entire output model including the claim title (`ao.verdict.title` is legal and confusing), and (c) in AGENTS.md the combined post-review artifact. Additionally, the identifier VERDICT_ORDER exists on both sides of the language boundary with different semantics: display sort order of all 7 values in TS vs a 5-value severity-distance scale in Python.","recommendation":{"canonical":"verdict = the enum value only","rationale":"Rename `VerdictAssessment` -> `ClaimAssessment` (it assesses a claim and carries far more than a verdict), `AnalystOutput.verdict` -> `assessment`, and `verdict_only_agent` -> `assessment_agent`. Rename the Python severity table `VERDICT_ORDER` -> `VERDICT_SEVERITY_SCALE` so it can never be confused with the TS display order.","blast_radius":"Python only: analyst/agent.py, orchestrator/pipeline.py (import at line 43), orchestrator/persistence.py (verdict_write_kwargs), auditor/compare.py, plus tests. No schema, content, or site change: the frontmatter field keeps its enum meaning."},"described_by":["taxonomy-code"]},{"concept":"The fourth agent role (independent re-assessment of the analyst)","variants":[{"term":"Evaluator (docs role name)","layer":"docs","count_source":"grep -c 'Evaluator' AGENTS.md = 4","sample":{"file":"AGENTS.md","line":118,"quote":"| **Evaluator** | Produces an independent evaluation of analyst output, returning `IndependentAssessment` | Automated | `auditor/` |"}},{"term":"auditor (package, agent, model override, sidecar keys)","layer":"pipeline","count_source":"word-frequency/pipeline-identifiers.json word_parts auditor=10, audit=17; grep -c 'auditor_' pipeline/orchestrator/cli.py = 10","sample":{"file":"pipeline/auditor/agent.py","line":15,"quote":"auditor_agent = Agent("}},{"term":"step-audit / audit (CLI verb)","layer":"pipeline","count_source":"grep -c 'step-audit' pipeline/orchestrator/cli.py = 9","sample":{"file":"pipeline/orchestrator/cli.py","line":1300,"quote":"@main.command(\"step-audit\")"}},{"term":"evaluating (Phase enum value, persisted in claim frontmatter)","layer":"pipeline","count_source":"enum-drift.json in_sync pair 'Phase -> phase:206'","sample":{"file":"pipeline/common/models.py","line":103,"quote":"EVALUATING = \"evaluating\""}}],"collision":"Within code itself the split is live: the AgentName is 'auditor', the CLI verb is 'audit', but the pipeline Phase for the same step is 'evaluating' — the only evaluator-family word in code. A contributor grepping 'audit' will not find the phase that represents auditing.","recommendation":{"canonical":"Auditor / audit","rationale":"Code is uniformly audit-family except Phase.EVALUATING; docs are Evaluator-family. Renaming docs is near-zero cost; renaming the code direction (auditor/ -> evaluator/) touches package paths, AgentName, sidecar keys (analyst_/auditor_), CLI, and Zod. Standardize docs on Auditor (drop the deferred evaluator/ rename entirely) and rename Phase.EVALUATING -> AUDITING with value 'auditing'.","blast_radius":"Docs: AGENTS.md + docs/architecture/glossary.md role tables. Code: Phase enum in pipeline/common/models.py, phase z.enum in src/content.config.ts:206, and any in-flight claims carrying phase: evaluating (research/ content is regenerated by the pipeline, so migration is m at all' (src/components/CriteriaMatrix.astro:15 `const assessed = rows.filter(r => r.verdict);`) — a third meaning of the assess family.","recommendation":{"canonical":"analyst_* / auditor_* prefixes end-to-end","rationale":"The persisted sidecar format and the site already use analyst_/auditor_; only the in-memory Python layer says primary_/assessed_. Rename ComparisonResult fields primary_* -> analyst_*, assessed_* -> auditor_*, and VerificationResult.consistency -> audit_comparison. This kills the primary-vs-primary collision for free.","blast_radius":"Python only: pipeline/auditor/{compare,models,report}.py, orchestrator/{persistence,pipeline}.py, tests (test_compare.py, test_auditor_*). Persisted YAML and the Zod auditSchema are untouched — that is the point."},"described_by":["taxonomy-code"]},{"concept":"The .audit.yaml sidecar (run provenance record)","variants":[{"term":".audit.yaml / audit sidecar","layer":"pipeline","count_source":"word-frequency/pipeline-identifiers.json word_parts sidecar=103, audit=17","sample":{"file":"pipeline/common/sidecar.py","line":1,"quote":"\"\"\"Read/write helpers for the `.audit.yaml` sidecar that lives next to each claim.\"\"\""}},{"term":"auditSchema (Zod schema for the WHOLE sidecar)","layer":"src","count_source":"word-frequency/site-identifiers.json identifiers auditSchema=1","sample":{"file":"src/content.config.ts","line":33,"quote":"const auditSchema = z.object({"}},{"term":"audit: (nullable block INSIDE the sidecar holding only the auditor comparison)","layer":"docs","count_source":"grep -c 'audit' 'src/pages/research/claims/[...slug].astro' = 40","sample":{"file":"src/content.config.ts","line":58,"quote":"audit: z.object({"}}],"collision":"One word, two nesting levels, different meanings, visible in a single expression: `audit.audit === null` (src/pages/research/claims/[...slug].astro:205). The outer 'audit' is mostly provenance (pipeline_run, models_used, sources_consulted, human_review); the inner 'audit' is the a mary\u003c/strong>, the organization's own output: company disclosures,"}},{"term":"source_type chip + tooltip (source detail page)","layer":"src","count_source":"grep -c 'source_type' src/pages/research/sources/[...slug].astro = 4","sample":{"file":"src/pages/research/sources/[...slug].astro","line":33,"quote":"secondary: \"Journalism, independent research, academic papers\","}},{"term":"independence counts: 'company-published / independent / unclassified' (claim page)","layer":"src","count_source":"grep -c 'company-published' src/lib/sourceQuality.ts = 1","sample":{"file":"src/lib/sourceQuality.ts","line":82,"quote":"if (counts.firstParty > 0) parts.push(`${counts.firstParty} company-published`);"}},{"term":"kind chip (report/article/documentation/...)","layer":"src","count_source":"word-frequency/ui-copy.json:words['kind'] = 5","sample":{"file":"src/pages/research/sources/[...slug].astro","line":74,"quote":"{source.data.kind}"}}],"collision":"KF-13's four internal axes surface as three unexplained reader axes: the FAQ promises 'three tiers', the claim page counts 'company-published' vs 'independent' (internally first-party — a term readers never see), and source pages add a 'kind' chip. The FAQ's secondary-tier definition ('journalism, academic papers, analyst reports, third-party certification records') and the chip tooltip ('Journalism, independent research, academic papers') have already drifted.","recommendation":{"canonical":"One reader vocabulary defined in one module: 'Source tier' (Primary/Secondary/Tertiary, one definition string reused by both FAQ and tooltip) and 'Source independence' (company-published/independent). 'kind' stays a plain format chip. Extract the tier definition strings from src/pages/research/sources/[...slug].astro into src/lib/sourceQuality.ts and render the FAQ list from them.","rationale":"Definitions duplicated between a page-local Record and hand-written FAQ prose will keep drifting; sourceQuality.ts already exists as the natural home.","blast_radius":"src/pages/research/sources/[...slug].astro (move 2 Records), src/lib/sourceQuality.ts (receive them), src/pages/research/index.astro (render FAQ tier list from the module). No schema change."},"described_by":["taxonomy-reader"]},{"concept":"the sponsoring brand and the word 'sponsored'","variants":[{"term":"TreadLightly AI (footer, FAQ)","layer":"ui","count_source":"grep -rl 'TreadLightly AI' src = 2 files","sample":{"file":"src/layouts/Base.astro","line":341,"quote":"Dangerous Robot is a research project sponsored by \u003ca href=\"https://treadlightly.ai\">TreadLightly AI\u003c/a>"}},{"term":"TreadLightlyAI (responsible-ai comparison page)","layer":"ui","count_source":"grep -c 'TreadLightlyAI' src/content/resources/responsible-ai.md = 3","sample":{"file":"src/content/resources/responsible-ai.md","line":286,"quote":"FULL DISCLOSURE: Dangerous Robot is sponsored by TreadLightlyAI."}},{"term":"'no sponsored verdicts' (methodology Limits)","layer":"ui","count_source":"grep -c 'sponsored' src/pages/research/index.astro = 3","sample":{"file":"src/pages/research/index.astro","line":292,"quote":"\u003cstrong>No paid research.\u003c/strong> No commissions, no sponsored verdicts."}}],"collision":"Two collisions: (1) the brand is spelled two ways ('TreadLightly AI' vs 'TreadLightlyAI') across reader surfaces; (2) 'sponsored' means site funding in the footer and the disclosure line, but paid-verdict corruption in the methodology Limits and COI FAQ, so the site literally says it is sponsored and that nothing is sponsored (extends KF-15).","recommendation":{"canonical":"One brand spelling site-wide (whichever treadlightly.ai itself uses), and reserve 'sponsored' for the paid-content sense the site denies: footer and disclosure become 'funded by TreadLightly AI' or 'a TreadLightly AI project'.","rationale":"For a transparency site, the funding sentence is the single line skeptical readers will quote; it should not share its key verb with the corruption the Limits section disclaims.","blast_radius":"3 files, 4 strings: src/layouts/Base.astro:341, src/content/resources/responsible-ai.md:286 (+2 spelling-only occurrences), src/pages/research/index.astro COI answer (spelling only). No code or schema."},"described_by":["taxonomy-reader"]},{"concept":"what Dangerous Robot calls itself","variants":[{"term":"structured research hub (default meta description)","layer":"src","count_source":"grep -rc 'structured research hub' src/layouts/Base.astro = 1","sample":{"file":"src/layouts/Base.astro","line":25,"quote":"Dangerous Robot is a structured research hub tracking AI company environmental and safety claims"}},{"term":"a transparency index (home hero meta)","layer":"ui","count_source":"grep -c 'a transparency index' src/pages/index.astro = 1","sample":{"file":"src/pages/index.astro","line":237,"quote":"\u003cspan>a transparency index\u003c/span>"}},{"term":"The research tool (research index eyebrow)","layer":"ui","count_source":"grep -c 'The research tool' src/pages/research/index.astro = 1","sample":{"file":"src/pages/research/index.astro","line":91,"quote":"\u003cp class=\"eyebrow\">The research tool\u003c/p>"}},{"term":"structured research project (FAQ) / research project (footer)","layer":"ui","count_source":"grep -c 'structured research project' src/pages/research/index.astro = 2","sample":{"file":"src/pages/research/index.astro","line":26,"quote":"Dangerous Robot is a structured research project that routes human questions through a Python pipeline"}}],"collision":"Five self-descriptions (hub, index, tool, project, plus the 'AI Transparency Research' home \u003ctitle>) across four reader surfaces. 'Index' is especially loaded: /resources/ai-safety is about FLI's AI Safety Index, so 'a transparency index' invites readers to expect scored rankings the site does not produce.","recommendation":{"canonical":"research hub in metadata and prose ('Dangerous Robot is a research hub that...'); drop 'index' and 'tool' as self-descriptions.","rationale":"'Hub' is already in the highest-distribution string (the default meta description) and does not promise a scoring methodology the way 'index' does.","blast_radius":"4 strings: src/pages/index.astro:237, src/pages/research/index.astro:91 (eyebrow) and the FAQ/footer phrasing; SEO titles unchanged."},"described_by":["taxonomy-reader"]},{"concept":"empty/inapplicable cell states in comparison matrices","variants":[{"term":"Not assessed (criteria matrix: no claim exists yet)","layer":"src","count_source":"word-frequency/ui-copy.json:labeled_phrases['Not assessed'] = 1","sample":{"file":"src/components/NotAssessedCell.astro","line":3,"quote":"\u003cspan class=\"not-assessed\" aria-label=\"Not assessed\">—\u003c/span>"}},{"term":"N/A (verdict not-applicable: assessed, does not apply)","layer":"src","count_source":"grep -c \"'not-applicable': 'N/A'\" src/lib/verdict.ts = 1","sample":{"file":"src/lib/verdict.ts","line":24,"quote":"'not-applicable': 'This criterion does not apply to this entity',"}},{"term":"Not applicable (Responsible AI matrix dash)","layer":"src","count_source":"word-frequency/ui-copy.json:labeled_phrases['Not applicable'] = 1","sample":{"file":"src/components/ResponsibleAIMatrix.astro","line":183,"quote":"\u003cspan class=\"na\" aria-label=\"Not applicable\">&ndash;\u003c/span>"}}],"collision":"Two visually identical dashes carry different meanings ('—' = not assessed yet in the criteria matrix; '–' = not applicable in the Responsible AI matrix), while the semantically 'not applicable' verdict renders as 'N/A'. A reader comparing the two matrices has no way to learn the distinction; the criteria matrix ships no legend.","recommendation":{"canonical":"'Not assessed' (em-dash, no claim yet) vs 'N/A' (assessed, inapplicable) everywhere, with a one-line legend on any matrix that uses either; the Responsible AI dash should adopt 'N/A' and its aria-label should match the visible legend term.","rationale":"The distinction (coverage gap vs deliberate non-applicability) is exactly the kind of nuance the site claims to care about; today it is encoded only in dash length.","blast_radius":"src/components/NotAssessedCell.astro (unchanged), src/components/ResponsibleAIMatrix.astro (1 span + legend row), src/components/CriteriaMatrix.astro (add legend line); glossary entries below."},"described_by":["taxonomy-reader"]}],"glossary":[{"term":"Audit (noun)","plain_definition":"The provenance record of how a claim was produced: which models ran, which sources were consulted, who signed off. Lives in the .audit.yaml sidecar. Not the act of evaluating a verdict.","confusables":["dr step-audit","Evaluator","Citation check"],"audience":"both","subsystem":"taxonomy-docs"},{"term":"audit sidecar (.audit.yaml)","plain_definition":"A YAML file next to each claim recording how the claim was produced: models used, sources consulted, failure info, human sign-off, and (inside its nullable `audit:` block) the analyst-vs-auditor comparison. Despite the name, most of it is run provenance, not the audit.","confusables":["audit: block (the inner comparison)","auditSchema (Zod schema for the whole sidecar)","audit trail","audit.audit (site access path)"],"audience":"contributor","subsystem":"taxonomy-code"},{"term":"Auditor (docs may say Evaluator)","plain_definition":"The fourth pipeline agent. It re-judges a claim from the same evidence without seeing the analyst's verdict, then the comparison is recorded. Docs call the role 'Evaluator'; all code (package auditor/, auditor_agent, dr step-audit, auditor_verdict) says auditor. The pipeline phase for this step is named 'evaluating'.","confusables":["Evaluator","step-audit","reassess (deprecated CLI alias)","evaluating (Phase value)"],"audience":"contributor","subsystem":"taxonomy-code"},{"term":"Claim","plain_definition":"A single checkable statement about an entity ('PRODUCT is hosted on renewable energy'), published with a verdict, confidence level, and cited sources.","confusables":["criterion","verdict"],"audience":"reader","subsystem":"taxonomy-reader"},{"term":"Confidence","plain_definition":"How strong the evidence behind a verdict is: high, medium, or low. A claim can be 'true' with low confidence.","confusables":["verdict"],"audience":"reader","subsystem":"taxonomy-reader"},{"term":"Criterion","plain_definition":"A reusable question the site asks of many entities (e.g. 'excludes frontier models'). Each criterion generates one claim per applicable entity. Stored in research/templates.yaml. Unrelated to a plan's acceptance criteria.","confusables":["claim template","templates.yaml","acceptance criteria"],"audience":"both","subsystem":"taxonomy-docs"},{"term":"criterion (plural: criteria)","plain_definition":"A reusable research question (e.g. 'COMPANY publishes a sustainability report') applied across many entities to generate claims. Stored in research/templates.yaml; pipeline code calls it a 'template' (TemplateRecord, template_slug); the site and reader pages call it 'criteria'. Same object.","confusables":["template","templates.yaml","criteria_slug (the claim field linking back to one criterion)"],"audience":"both","subsystem":"taxonomy-code"},{"term":"Entity","plain_definition":"A thing claims are about: a company, a product, or a subject.","confusables":["subject","topic"],"audience":"both","subsystem":"taxonomy-reader"},{"term":"Evaluation","plain_definition":"The Evaluator's independent second opinion on the Analyst's draft verdict. Stored in the audit sidecar; disagreements go to the operator, never auto-resolved.","confusables":["audit","assessment","adversarial review","reassess"],"audience":"both","subsystem":"taxonomy-docs"},{"term":"Evaluator (agent)","plain_definition":"The pipeline agent that independently re-checks the analyst's draft verdict against the sources. Older copy and code call it the auditor.","confusables":["auditor","analyst","audit sidecar"],"audience":"both","subsystem":"taxonomy-reader"},{"term":"Frontier-scale model","plain_definition":"A model that at release is top-5 on major benchmarks or larger than 100B parameters. A moving target; claim narratives state which test was applied and when.","confusables":["frontier AI","large model"],"audience":"reader","subsystem":"taxonomy-reader"},{"term":"independence","plain_definition":"Per-source field: 'first-party' (the entity talking about itself), 'independent', or 'unknown'. Derived mechanically from source_type (primary->first-party, secondary->independent, tertiary->unknown). Readers see first-party rendered as 'company-published' and unknown as 'unclassified'.","confusables":["source_type (primary/secondary/tertiary)","publisher_quality (pre-ingest hostname guess, adds 'forum')","kind (report/article/paper/... — what the document is)"],"audience":"both","subsystem":"taxonomy-code"},{"term":"needs_review vs human_review","plain_definition":"needs_review is a machine-set boolean in the sidecar's audit block: the auditor disagreed enough that an operator should look. human_review is the sidecar block recording that an operator actually signed off (reviewer, date, notes). `dr review` writes the latter; nothing automatic clears the former.","confusables":["dr review (CLI command)","review-queue","ReviewMode 'review' (sign-off without status change)"],"audience":"contributor","subsystem":"taxonomy-code"},{"term":"Not assessed vs N/A","plain_definition":"'Not assessed' (—) means no claim exists yet for that entity/criterion pair. 'N/A' means the pair was assessed and the criterion does not apply.","confusables":["not applicable"],"audience":"reader","subsystem":"taxonomy-reader"},{"term":"Open-weight model","plain_definition":"A model whose trained weights are downloadable and runnable on your own infrastructure, as opposed to a proprietary model reachable only through the vendor's service.","confusables":["open source"],"audience":"reader","subsystem":"taxonomy-reader"},{"term":"Operator","plain_definition":"The human who runs dr commands, reviews drafts, and signs claims off. In v1 the same person also fills the Research Lead role (planning and queueing work).","confusables":["Research Lead","reviewer","human"],"audience":"contributor","subsystem":"taxonomy-docs"},{"term":"Phase","plain_definition":"The claim frontmatter field naming which pipeline step is in flight (researching, ingesting, analyzing, evaluating). Plans use named stages, not phase numbers.","confusables":["Phase 2 (plan stage)","step","status"],"audience":"contributor","subsystem":"taxonomy-docs"},{"term":"primary","plain_definition":"Two meanings. On sources: a first-party publisher (source_type 'primary'). In the auditor package: the analyst's original result (primary_verdict, primary_confidence) as opposed to the auditor's (assessed_verdict). Check which axis you are on before grepping.","confusables":["primary_verdict","source_type: primary","first-party"],"audience":"contributor","subsystem":"taxonomy-code"},{"term":"Recheck cadence","plain_definition":"How often a published claim is scheduled for automated re-research (default every 60 days). Shown as the 'as of' date. Distinct from human review.","confusables":["review","as of"],"audience":"reader","subsystem":"taxonomy-reader"},{"term":"Reviewed / Unreviewed","plain_definition":"Whether a named human operator has signed off on this specific claim. Auto-published claims render as Unreviewed until a human review is recorded.","confusables":["unverified","recheck"],"audience":"reader","subsystem":"taxonomy-reader"},{"term":"Sign-off","plain_definition":"The recorded human approval of a claim, written to the audit sidecar by dr review. Distinct from PR review (code/content diff approval) and from a plan's Review history rows.","confusables":["review","approve","publish","human review"],"audience":"both","subsystem":"taxonomy-docs"},{"term":"Source tier","plain_definition":"Primary (the organization's own output), Secondary (independent journalism or research), or Tertiary (advocacy, opinion, aggregators).","confusables":["kind","independence","publisher quality"],"audience":"both","subsystem":"taxonomy-reader"},{"term":"Status vs derived condition","plain_definition":"status is the stored claim state (draft, published, archived, blocked). Conditions like queued, under review, and stale are derived from QUEUE.md, PR state, or elapsed time; they are never written to frontmatter.","confusables":["state","lifecycle","under_review","stale","queued"],"audience":"contributor","subsystem":"taxonomy-docs"},{"term":"step vs phase vs agent","plain_definition":"Same pipeline position, three vocabularies: the agent (noun: researcher/ingestor/analyst/auditor), the CLI step (verb: step-research/step-ingest/step-analyze/step-audit), and the claim's phase (gerund: researching/ingesting/analyzing/evaluating). Note the last column: the auditor's phase is 'evaluating', and FailureStep mixes both families ('research', 'ingest', 'analyst', 'auditor').","confusables":["FailureStep","acquisition.stage (2-value: research/ingest)","Phase"],"audience":"contributor","subsystem":"taxonomy-code"},{"term":"Subject","plain_definition":"An entity type for things that are not a single company or product (e.g. us-data-centers, generative-ai). Not the same as a claim's topics tags.","confusables":["topic","topics","sector (retired name)","entity"],"audience":"both","subsystem":"taxonomy-docs"},{"term":"topic","plain_definition":"One of eight subject-area slugs (ai-safety, environmental-impact, ...) attached to every claim and criterion. In Python code this vocabulary is the `Category` enum; on the site it is the `Category` TS type, the `topics` frontmatter field, and the /research/topics/ pages. All four are the same thing.","confusables":["Category","category (CSS class)","topics (resources collection — a different 4-value list)","subject (an entity type, NOT a topic)"],"audience":"both","subsystem":"taxonomy-code"},{"term":"Unverified (verdict)","plain_definition":"Sources were sought but none directly answers the claim either way. Not the same as an unverified entity, an unreviewed claim, or a low verification level.","confusables":["Unreviewed","verification_status","verification level"],"audience":"reader","subsystem":"taxonomy-reader"},{"term":"verdict","plain_definition":"The seven-value judgment on a claim (true ... false, unverified, not-applicable). In analyst code, `AnalystOutput.verdict` confusingly holds the entire VerdictAssessment (title, narrative, topics, and the verdict), not just the value.","confusables":["VerdictAssessment (analyst's full output)","IndependentAssessment (auditor's output)","draft verdict (docs: analyst's proposal pre-review)","VERDICT_ORDER (display order in TS; severity scale in Python)"],"audience":"both","subsystem":"taxonomy-code"},{"term":"Verification level","plain_definition":"A claim field measuring how diverse its source pool is (claimed through multiply-verified). It does not mean the claim was independently confirmed. Unrelated to an entity's verification_status (identity vetting) and to CI checks.","confusables":["verification_status","verification scale","verified"],"audience":"reader","subsystem":"taxonomy-docs"},{"term":"verification_level vs verification_status","plain_definition":"Unrelated despite the shared word. verification_level (on claims): how diverse the source pool is, from 'claimed' to 'multiply-verified' (shown to readers as 'Cross-verified'). verification_status (on entities): whether the entity's identity was vetted ('verified', 'unverified-startup', 'unverified-other').","confusables":["verify_claim (runs the whole pipeline)","entity verifier (agent)","unverified (a Verdict value)","Cross-verified (reader label for multiply-verified)"],"audience":"both","subsystem":"taxonomy-code"},{"term":"Workflow vs pipeline","plain_definition":"The pipeline is the Python automation under pipeline/. The workflow is the whole process around it: queueing, pipeline runs, PR review, sign-off, publish, recheck.","confusables":["research-flow","flow","lifecycle"],"audience":"contributor","subsystem":"taxonomy-docs"}]},"wordFreq":{"docs":{"meta":{"commit":"43a1575d73a38932173dab461d4d66c15ce9efdb","generated_by":"word_frequency.py","files":121,"corpus":"docs prose"},"words":[["claim",1147],["source",755],["entity",726],["plan",694],["claims",603],["schema",587],["add",567],["path",533],["agent",511],["pipeline",489],["sources",484],["existing",484],["review",483],["one",478],["content",465],["field",448],["phase",415],["verdict",412],["already",393],["analyst",379],["page",367],["url",366],["operator",350],["research",344],["per",333],["scope",333],["site",310],["change",310],["status",303],["section",302],["without",297],["commit",282],["step",273],["sidecar",273],["work",265],["pages",262],["run",260],["frontmatter",257],["changes",257],["two",244],["implementation",243],["test",242],["check",241],["reviewer",232],["model",227],["full",227],["rename",225],["build",225],["company",224],["item",224],["added",222],["code",219],["current",216],["pass",215],["state",215],["template",213],["tier",212],["set",212],["quality",209],["first",208],["cli",208],["block",207],["call",207],["three",207],["update",205],["exists",203],["audit",202],["published",199],["against",199],["prompt",198],["ingestor",197],["runs",196],["must",191],["enum",189],["every",189],["needed",188],["tests",187],["history",185],["decision",184],["researcher",180],["scorer",179],["fields",179],["confidence",178],["output",177],["data",177],["orchestrator",176],["verification",174],["text",172],["single",169],["surface",168],["today",166],["agents",165],["returns",165],["product",162],["note",162],["body",160],["independent",160],["part",159],["keep",156],["products",151],["date",150],["auditor",150],["deferred",149],["open",149],["stub",149],["criteria",147],["small",146],["design",145],["draft",144],["slug",144],["urls",144],["templates",143],["done",143],["t
