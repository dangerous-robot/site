<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claim mark candidates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#19191b;color:#dcdde0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65}
a{color:#42958b}a:hover{color:#5fb3a8}
</style>
</helmet>
<div style="background:#19191b;color:#dcdde0;min-height:100%;">
<div style="max-width:60rem;margin:0 auto;padding:1.5rem 16px 3rem;box-sizing:border-box;">
<h1 style="font-family:Georgia,'Times New Roman',Times,serif;font-size:1.5rem;font-weight:400;line-height:1.25;color:#d0d7c7;margin:0 0 0.25rem;">Claim mark candidates</h1>
<p style="font-size:0.9rem;color:#9a9aa8;margin:0 0 1.25rem;">Each icon at 14, 18 (the mark size) and 24px in the accent color, then at 18px after a green Yes check, as it would sit in a cell.</p>
<div style="overflow-x:auto;">
<div style="display:grid;grid-template-columns:12rem repeat(4, minmax(5rem, 1fr));min-width:36rem;align-items:center;font-size:0.9rem;">
<div style="padding:0.5rem;color:#8a8a9a;font-size:0.8rem;border-bottom:1px solid #4e4e5a;">Candidate</div>
<div style="padding:0.5rem;color:#8a8a9a;font-size:0.8rem;border-bottom:1px solid #4e4e5a;">14px</div>
<div style="padding:0.5rem;color:#8a8a9a;font-size:0.8rem;border-bottom:1px solid #4e4e5a;">18px</div>
<div style="padding:0.5rem;color:#8a8a9a;font-size:0.8rem;border-bottom:1px solid #4e4e5a;">24px</div>
<div style="padding:0.5rem;color:#8a8a9a;font-size:0.8rem;border-bottom:1px solid #4e4e5a;">In a cell</div>
<sc-for list="{{icons}}" as="ic" hint-placeholder-count="7">
<div style="padding:0.6rem 0.5rem;color:#d0d7c7;border-bottom:1px solid #2c2c36;">{{ic.name}}<div style="font-size:0.75rem;color:#8a8a9a;line-height:1.4;">{{ic.note}}</div></div>
<div style="padding:0.6rem 0.5rem;border-bottom:1px solid #2c2c36;height:100%;box-sizing:border-box;display:flex;align-items:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#42958b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.p0}}"></path><path d="{{ic.p1}}"></path><path d="{{ic.p2}}"></path><path d="{{ic.p3}}"></path><path d="{{ic.p4}}"></path></svg></div>
<div style="padding:0.6rem 0.5rem;border-bottom:1px solid #2c2c36;height:100%;box-sizing:border-box;display:flex;align-items:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#42958b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.p0}}"></path><path d="{{ic.p1}}"></path><path d="{{ic.p2}}"></path><path d="{{ic.p3}}"></path><path d="{{ic.p4}}"></path></svg></div>
<div style="padding:0.6rem 0.5rem;border-bottom:1px solid #2c2c36;height:100%;box-sizing:border-box;display:flex;align-items:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#42958b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.p0}}"></path><path d="{{ic.p1}}"></path><path d="{{ic.p2}}"></path><path d="{{ic.p3}}"></path><path d="{{ic.p4}}"></path></svg></div>
<div style="padding:0.6rem 0.5rem;border-bottom:1px solid #2c2c36;height:100%;box-sizing:border-box;display:flex;align-items:center;gap:0.4rem;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2d8a4e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#42958b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.p0}}"></path><path d="{{ic.p1}}"></path><path d="{{ic.p2}}"></path><path d="{{ic.p3}}"></path><path d="{{ic.p4}}"></path></svg></div>
</sc-for>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
renderVals() {
var list = [
{ name: 'Check badge', note: 'v2 mark; rejected, reads as Yes', paths: ['M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z', 'm9 12 2 2 4-4'] },
{ name: 'Scale', note: 'v3 mark; a verdict', paths: ['m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z', 'm2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z', 'M7 21h10', 'M12 3v18', 'M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2'] },
{ name: 'Gavel', note: 'a ruling', paths: ['m14.5 12.5-8 8a2.119 2.119 0 1 1-3-3l8-8', 'm16 16 6-6', 'm8 8 6-6', 'm9 7 8 8', 'm21 11-8-8'] },
{ name: 'Quote bubble', note: 'a statement someone made', paths: ['M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z', 'M8 12a2 2 0 0 0 2-2V8H8', 'M14 12a2 2 0 0 0 2-2V8h-2'] },
{ name: 'Magnifier', note: 'investigated', paths: ['M11 3a8 8 0 1 0 0 16a8 8 0 1 0 0-16', 'm21 21-4.3-4.3'] },
{ name: 'Stamp', note: 'approved by a reviewer', paths: ['M5 22h14', 'M19.27 13.73A2.5 2.5 0 0 0 17.5 13h-11A2.5 2.5 0 0 0 4 15.5V17a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1.5c0-.66-.26-1.3-.73-1.77Z', 'M14 13V8.5C14 7 15 7 15 5a3 3 0 0 0-3-3c-1.66 0-3 1-3 3s1 2 1 3.5V13'] },
{ name: 'Link (source mark)', note: 'for contrast', paths: ['M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71', 'M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'] }
];
// Fixed path slots: a loop inside <svg> may not render in the canvas runtime.
return { icons: list.map(function (ic) {
var p = ic.paths.concat(['', '', '', '', '']);
return { name: ic.name, note: ic.note, p0: p[0], p1: p[1], p2: p[2], p3: p[3], p4: p[4] };
}) };
}
}
</script>
</body>
</html>
