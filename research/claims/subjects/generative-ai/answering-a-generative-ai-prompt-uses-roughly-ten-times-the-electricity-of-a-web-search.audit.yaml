audit:
  analyst_verdict: mixed
  auditor_verdict: mixed
  analyst_confidence: medium
  auditor_confidence: medium
  verdict_agrees: true
  confidence_agrees: true
  needs_review: true
  auditor_reasoning: Source 2 (Kanoppi) and Source 5 (The National) explicitly state
    that a generative AI query consumes about ten times the electricity of a Google
    search, directly supporting the claim. However, Source 1 (IEEE Spectrum) and Source
    4 (Microsoft Research) report per‑query energy of ~0.34 Wh (0.00034 kWh), which
    is only ~1.1× the 0.0003 kWh per Google search reported in Source 7, contradicting
    the ten‑fold claim for typical queries. Source 3 (Elsevier) notes that only longer,
    reasoning‑intensive queries reach ~13× the search baseline. Because the evidence
    includes both supporting and contradicting statements, the overall assessment
    is mixed.
  evidence_gaps:
  - The claim does not specify the type or complexity of the AI prompt; sources show
    that typical queries may be near parity with web searches, while long reasoning
    queries can be >10×.
  - Some sources (IEEE Spectrum, Microsoft Research, Elsevier) provide absolute energy
    per query without directly stating the multiplier relative to a web search, requiring
