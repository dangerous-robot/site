  auditor_reasoning: All eight sources quantify the electricity consumption of a single
    generative‑AI prompt, reporting figures between 0.24 and 0.34 Wh. None of these
    sources include any measurement or estimate of the electricity used by a typical
    web search. Therefore the narrative’s assertion that the web‑search baseline is
    unaddressed in the provided evidence is accurate, and we indeed lack the data
    to verify the ten‑times‑more claim.
