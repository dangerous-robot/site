audit:
  analyst_verdict: mostly-true
  auditor_verdict: mostly-true
  analyst_confidence: medium
  auditor_confidence: medium
  verdict_agrees: true
  confidence_agrees: true
  needs_review: true
  auditor_reasoning: Iron Mountain’s claim of “100% matched renewable energy” and
    CoreSite’s explanation of RECs show operators use certificate‑based accounting
    rather than direct renewable supply. The Uptime Institute report explicitly warns
    that reliance on renewable‑energy certificates is a common source of green‑washing,
    confirming that many “100% renewable” statements refer to purchases rather than
    hour‑by‑hour renewable power. The Top 10 list’s reference to Google’s “matched”
    renewable electricity further supports the interpretation. While some providers
    (e.g., Switch) achieve direct renewable use, the available sources collectively
    indicate that the typical meaning of a 100% renewable claim is certificate‑based,
    matching the claim’s wording.
  evidence_gaps:
  - No quantitative data on what proportion of big data‑center operators rely on RECs
    versus on‑site renewable generation.
  - Few sources explicitly state that the renewable power does not run the servers
    hour‑by‑hour; the inference is based on definitions of “matched” renewable energy
    and discussion of RECs.
  - The source pool is limited to a handful of operators and industry analyses, not
    a comprehensive survey of all large U.S. data‑center providers.
  needs_review_reasons:
  - 2+ evidence gaps
  pipeline_verdict: mostly-true
  pipeline_confidence: medium
  rule_applied: agreed
