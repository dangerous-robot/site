  auditor_reasoning: Iron Mountain, Meta, and Digital Realty explicitly state that
    their electricity is "matched" with renewable energy but give no detail on whether
    this matching is annual or hourly. Google’s report expresses a goal of hour‑by‑hour
    carbon‑free power, not an established practice. The state attorneys‑general letter
    and the regulation‑focused blog both allege that firms rely on unbundled RECs,
    which are typically used for annual matching, indicating that the common interpretation
    of "100% renewable" is indeed annual certificate matching. Together, these sources
    support the claim that such statements generally refer to annual certificate matching
    rather than real‑time renewable consumption, though the evidence is limited to
    self‑reported disclosures and a legal allegation, yielding low confidence.
