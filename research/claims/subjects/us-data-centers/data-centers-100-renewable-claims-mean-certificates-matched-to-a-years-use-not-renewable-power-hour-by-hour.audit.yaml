  tiebreaker_reasoning: Iron Mountain (Source 1) and Meta (Source 7) both describe
    their 100% renewable claims as “matched” renewable energy, a phrasing that conventionally
    refers to annual REC matching. The state‑attorney‑general letter (Source 5) explicitly
