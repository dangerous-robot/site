         - [`https://datacenters.microsoft.com/sustainability/efficiency`](https://datacenters.microsoft.com/sustainability/efficiency),
         - [`https://publicpolicy.google/energy`](https://publicpolicy.google/energy).

    2. **sq2**: Required third-party verification (e.g., GRESB, ESG databases, or ESG reports) listing US data centers by name. Only **GRESB** and **Energy Star’s enrollment data sources** theoretically could meet this requirement, but the abstractness of GRESB’s content and the lack of a list of names in each candidate snippet dropped this route. GretaTechMedia’s and Data Center Magazine’s lack of granularity (e.g., no exact numbers/centers) also crowds out their relevance. `Uptime Institute` and `Green Building Initiative` mentioned third-party certifications but did not list centers by name or count.

       - Rationale: Only `https://uptimeinstitute.com/renewable-energy-for-data-centers` scored **2/3** for SQ2 due to vague references to databases. All others dropped.

