    1. **sq1**: Required first-party sources (e.g., sustainability reports, website claims) explicitly detailing renewable energy usage for US data centers. Many candidates addressed this, including Iron Mountain, Google, Microsoft, Aligned, and CyrusOne, which explicitly mention projects (e.g., Iron Mountain’s 5 US Energy Star-certified sites, Google’s full renewable energy match).

