    Claude is reported to train on chats by default (Strac.io), though other coverage
    mentions explicit opt‑in/opt‑out, indicating default training for at least some
    users. Meta's AI is described as collecting public and chatbot data for training
    with no automatic opt‑out, implying default use. However, OpenAI's own enterprise
    privacy documentation explicitly states it does not train models on user data
    by default, contradicting the claim that all four companies train by default.
    Since the claim is false for OpenAI, the overall statement is false.
