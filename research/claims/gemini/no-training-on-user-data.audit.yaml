  auditor_reasoning: Source 1 (PPC Land) reports that Gemini’s Personal Context feature
    uses user conversations for model training by default worldwide except the EU,
    UK, and Switzerland, where it is disabled, requiring users to opt out elsewhere.
    This indicates a regional difference in the consumer default, matching the criterion
    for a mixed verdict. Sources 2–4 (Google documentation) state that Gemini does
    not use prompts or responses for training, but they pertain to enterprise or Cloud
    contexts and conflict with the independent report for non‑EU users. The combination
    of region‑dependent policy (source 1) and contradictory self‑reported claims (sources
    2–4) leads to a mixed assessment.
