name = "dr-api"
main = "src/index.ts"
compatibility_date = "2026-08-20"
workers_dev = false

# The deploy creates the DNS record and certificate for this hostname.
routes = [{ pattern = "api.dangerousrobot.org", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "dr-api"
database_id = "8594b5ae-cfeb-470c-b0cd-8509df1fe108"
migrations_dir = "migrations"

# Sign attempts per IP per minute. Counts are kept per Cloudflare location,
# not globally, which is close enough for spam control.
[[ratelimits]]
name = "SIGN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Cleanup (unconfirmed signatures, closed-petition emails) and the 4-day confirmation
# reminders. Hourly while the first reminders are checked; then back to "17 11 * * *".
[triggers]
crons = ["17 * * * *"]

# Secrets (set with `wrangler secret put`): RESEND_API_KEY, TURNSTILE_SECRET_KEY.
# TURNSTILE_HOSTNAME and TURNSTILE_ACTION stay unset here: the code defaults are the
# production values. .dev.vars sets them for Cloudflare's test keys.
# Local overrides live in .dev.vars (see .dev.vars.example).
[vars]
# Base of the confirm and remove links. The daily reminder has no request to read it from.
API_ORIGIN = "https://api.dangerousrobot.org"
ALLOWED_ORIGINS = "https://dangerousrobot.org"
MAIL_FROM = "Dangerous Robot <no-reply@dangerousrobot.org>"
MAIL_REPLY_TO = "contact@dangerousrobot.org"
EMAIL_MODE = "resend"

# Workers Logs: keeps each run's outcome and console output for a few days, searchable
# in the dashboard. The cron job has no other record of what it did.
[observability]
enabled = true
