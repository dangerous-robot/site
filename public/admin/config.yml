# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Local use: open http://localhost:4321/admin/index.html in Chrome (Astro dev
# does not serve the /admin/ folder index) and click "Work with Local Repository",
# then pick this repo's root folder. Edits are written to disk; commit them yourself.
#
# Production login (TODO): GitHub sign-in needs the Sveltia CMS Authenticator
# (https://github.com/sveltia/sveltia-cms-auth) deployed as a Cloudflare Worker,
# with its URL set as backend.base_url below.
backend:
  name: github
  repo: dangerous-robot/site
  branch: main
  # base_url: https://<your-sveltia-cms-auth-worker>.workers.dev

media_folder: public/images/writing
public_folder: /images/writing

# Drop empty optional fields (e.g. updatedDate) instead of writing empty
# strings, which Astro's content schema would reject.
output:
  omit_empty_optional_fields: true

collections:
  # Mirrors the `writing` collection schema in src/content.config.ts.
  - name: writing
    label: Writing
    label_singular: Post
    folder: src/content/writing
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - name: description
        label: Description
        widget: string
        hint: One sentence, 200 characters max (longer fails the site build).
        maxlength: 200
      - name: pubDate
        label: Publish date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        # UTC keeps a date picked in Seattle from saving as the previous day.
        input_timezone: utc
      - name: updatedDate
        label: Updated date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        # UTC keeps a date picked in Seattle from saving as the previous day.
        input_timezone: utc
        required: false
      - { name: author, label: Author, widget: string, default: Brandon Faloona }
      - { name: ai_assisted, label: AI assisted, widget: boolean, default: false, hint: On when AI drafted the text }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: petition, label: Petition slug, widget: string, required: false, hint: Slug of the petition row in the dr-api Worker; adds a sign block under the post }
      - { name: petition_statement, label: Petition statement, widget: text, required: false, hint: The sentence signers put their name to; the sign block sets it large above the count }
      - { name: body, label: Body, widget: markdown }

  # Mirrors the `resources` collection schema in src/content.config.ts, for
  # `layout: article` entries only. Matrix, guide and tool entries carry a
  # structured `data` payload the admin cannot edit, so the filter hides them.
  - name: resources
    label: Resources
    label_singular: Article
    folder: src/content/resources
    filter: { field: layout, value: article }
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    # Leading slash: relative to the repo root, not the entry file.
    media_folder: /public/images/resources
    public_folder: /images/resources
    fields:
      - { name: title, label: Title, widget: string }
      - name: description
        label: Description
        widget: string
        hint: One sentence, 200 characters max (longer fails the site build).
        maxlength: 200
      - name: pubDate
        label: Publish date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        # UTC keeps a date picked in Seattle from saving as the previous day.
        input_timezone: utc
      - { name: layout, label: Layout, widget: hidden, default: article }
      - name: wallpaper
        label: Wallpaper
        widget: select
        options: [default, ai-safety, responsible-ai, none]
        default: default
      - name: topics
        label: Topics
        widget: select
        multiple: true
        min: 1
        max: 3
        options: [ai-literacy, ai-safety, consumer-guide, responsible-ai]
      - { name: noindex, label: Hide from search engines, widget: boolean, default: false }
      - name: further_reading
        label: Further reading
        widget: list
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - { name: url, label: URL, widget: string, type: url }
          - { name: publisher, label: Publisher, widget: string, required: false }
          - name: last_checked
            label: Last checked
            widget: datetime
            type: date
            format: YYYY-MM-DD
            # UTC keeps a date picked in Seattle from saving as the previous day.
            input_timezone: utc
            required: false
      - { name: body, label: Body, widget: markdown }
