# Curated playlists for /watch. The build fetches titles, videos and
# thumbnails from the YouTube Data API; nothing from the API is stored here.
# Schema: src/lib/watch/schema.ts (curatedFileSchema).
#
# slug        ?list= value in shared URLs; kebab-case, unique
# playlist_id YouTube playlist ID, unique
# order       tab order, unique positive integer
# description editor copy, max 200 characters; omit to use the API description
# creator     optional; overrides the owner channel name from the API
# max_videos  optional, 1 to 200, default 50
#
