name: Scheduled recheck
on:
  # Mondays 07:17 UTC, an hour after the weekly deploy. Every run with a claim due
  # is a paid run, so the cadence is the operator's call.
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# One batch at a time: a long paid run and the next scheduled run never overlap.
concurrency:
  group: recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    # A starting value, not a measurement: each due claim runs the full loop,
    # archive.org captures included.
    timeout-minutes: 120
    # Only this job writes, and only to the Actions branch the script pushes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # The script checks whether the last batch's branch is merged into main,
          # which needs both histories; a shallow clone would make every batch
          # after the first look unmerged.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.0"

      - name: Sync pipeline dependencies
        run: uv sync --locked

      # The provider and search keys reach this step only. A missing key fails the
      # run before any model call; a run with nothing due never reads them.
      - name: Recheck due claims and push the batch
        env:
          GREENPT_API_KEY: ${{ secrets.GREENPT_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECHECK_BRANCH: actions/recheck
        run: bash scripts/scheduled-recheck.sh
