name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs that install packages (verify, build) hold no write rights; only the
# deploy job can publish to Pages. A called workflow inherits the caller's
# permissions, so verify narrows them explicitly.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The CMS admin page is for local editing only; keep it off the live site.
      - run: rm -rf dist/admin && test ! -e dist/admin
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
