name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # YouTube API data may be stored for at most 30 days, so /watch is rebuilt
  # weekly. A scheduled run checks out main's latest commit, which a push
  # deploy has already shipped, so only the YouTube data changes.
  schedule:
    - cron: '17 6 * * 1'

# Jobs that install packages (verify, build) hold no write rights; only the
# deploy job can publish to Pages. A called workflow inherits the caller's
# permissions, so verify narrows them explicitly.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # No timeout-minutes here: a called workflow cannot take one, and each job
  # in ci.yml sets its own.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # VERSION.md: every deploy bumps the beta number and gets a tag. An
      # untagged push to main must not reach the live site.
      - name: Require a tagged release
        run: bash scripts/check-release-tag.sh "$GITHUB_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Without the Turnstile site key the sign form cannot pass the Worker's
      # bot check, so signing would break; stop here and keep the live site.
      - name: Require the Turnstile site key
        run: |
          if [ -z "$PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "::error::Set the TURNSTILE_SITE_KEY repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      # The key goes to this step and the check below only. WATCH_EXPECT_KEY
      # makes a missing key a warning annotation; the build still succeeds
      # and publishes the /watch empty state.
      - run: npm run build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          WATCH_EXPECT_KEY: '1'
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      # Needs the key to scan dist/ for its exact value.
      - run: npm run check:watch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          WATCH_CHECK_CONTEXT: deploy
      - run: npm run check:flyers
      # The CMS admin page is for local editing only; keep it off the live site.
      - run: rm -rf dist/admin && test ! -e dist/admin
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
