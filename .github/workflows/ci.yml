name: CI
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Offline, invented /watch data, so the dist check sees a full page
    # without the YouTube key.
    env:
      WATCH_DATA: fixture
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:types
      - run: npm run test:site
      - run: npm run build
      - run: npm run check:watch
      - run: npm run lint:md
      - run: npm run check:citations

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the site with fixture data and serves it on port 4329.
      - run: npm run test:e2e
      # Traces and failure screenshots. The cache path starts with a dot,
      # which the upload skips unless told otherwise.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: node_modules/.cache/watch-e2e/*/test-results/
          include-hidden-files: true
          retention-days: 7

  lint-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.0"

      # --locked fails if uv.lock is stale, so CI installs exactly what the lock says.
      - name: Sync pipeline dependencies
        run: uv sync --locked

      - name: Run dr lint
        id: dr_lint
        run: |
          set +e
          uv run dr lint --format json --severity error > lint-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: pipeline

      - name: Annotate errors
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pipeline/lint-report.json';
            if (!fs.existsSync(path)) return;
            const raw = fs.readFileSync(path, 'utf8').trim();
            if (!raw) return;
            const issues = JSON.parse(raw);
            for (const issue of issues) {
              if (issue.severity !== 'error') continue;
              core.error(issue.message, { file: issue.path, title: issue.check_id });
            }

      - name: Fail on lint errors
        if: steps.dr_lint.outputs.exit_code != '0'
        run: |
          echo "dr lint reported errors; see annotations above."
          exit 1
